name: Plus image (GHCR)

# Builds the WAHA GOWS image with the GOWS binary from the DennyLoko/gows-plus
# fork and publishes it to GHCR. Runs on "<waha-version>-plus.<n>" tags
# (e.g. 2026.9.2-plus.1) and manually. A tag publishes
# gows-<waha-version> (same name as upstream, e.g. gows-2026.9.2),
# gows-<tag> (exact rebuild) and gows-plus-latest.
on:
  push:
    tags:
      - '20*-plus.*'
  workflow_dispatch:
    inputs:
      gows_ref:
        description: 'DennyLoko/gows-plus ref (branch, tag or SHA)'
        required: false
        default: 'plus'

permissions:
  contents: read
  packages: write

concurrency:
  group: plus-image-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWS_REPO: DennyLoko/gows-plus

jobs:
  build:
    if: github.repository == 'DennyLoko/waha'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout WAHA
        uses: actions/checkout@v4

      - name: Checkout gows-plus
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GOWS_REPO }}
          ref: ${{ inputs.gows_ref || 'plus' }}
          path: .gows-src

      - name: Versions
        id: v
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/waha"
          gows_sha=$(git -C .gows-src rev-parse --short HEAD)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            # upstream version: 2026.9.2-plus.1 -> 2026.9.2
            upstream="${GITHUB_REF_NAME%%-plus.*}"
          else
            version="dev-$(git rev-parse --short HEAD)"
            upstream=""
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "upstream=$upstream"
            echo "gows_sha=$gows_sha"
          } >> "$GITHUB_OUTPUT"
          echo "WAHA $version (upstream ${upstream:-n/a}), gows-plus $gows_sha -> $image"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build WAHA base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            USE_BROWSER=none
            WHATSAPP_DEFAULT_ENGINE=GOWS
          tags: waha-plus:base
          load: true
          push: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=raw,value=gows-${{ steps.v.outputs.upstream }},enable=${{ steps.v.outputs.upstream != '' }}
            type=raw,value=gows-${{ steps.v.outputs.version }}
            type=raw,value=gows-plus-latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=WAHA (GOWS, plus fork)
            io.dennyloko.gows-plus.sha=${{ steps.v.outputs.gows_sha }}

      - name: Build and push (gows-plus overlay)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.plus
          platforms: linux/amd64
          build-contexts: |
            gows-src=.gows-src
          build-args: |
            WAHA_IMAGE=waha-plus:base
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

      - name: Summary
        run: |
          {
            echo "### ${{ steps.v.outputs.image }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "gows-plus: ${{ env.GOWS_REPO }}@${{ steps.v.outputs.gows_sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
